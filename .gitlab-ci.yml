stages: [secret-scan, build, deploy]

variables:
  APP_NAME: processos-publico
  APP_HOST: codigos.sicoobcredisul.net
  CHART_REPO: "credisul/ci-templates"
  CHART_PATH: "charts/app"

.img: &img
  - export IMG_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"

# ─── SECRET SCAN ──────────────────────────────────────────────────────────────
secret-scan:
  stage: secret-scan
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --log-opts="--all" --redact -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ─── BUILD ────────────────────────────────────────────────────────────────────
build:
  stage: build
  image: docker:27-cli
  script:
    - *img
    - echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin
    - docker build -t "$ACR_REGISTRY/$APP_NAME:$IMG_TAG" .
    - docker push "$ACR_REGISTRY/$APP_NAME:$IMG_TAG"
    - docker logout "$ACR_REGISTRY"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ─── DEPLOY ───────────────────────────────────────────────────────────────────
deploy-prod:
  stage: deploy
  image: crcredisul.azurecr.io/ci-deploy:latest
  environment: { name: prod }
  script:
    - *img
    - kubectl config use-context "$KUBE_CONTEXT_PROD"
    - kubectl get ns "$APP_NAME" >/dev/null 2>&1 || kubectl create ns "$APP_NAME"
    - printf '%s' "$DOCKER_AUTH_CONFIG" > /tmp/dac.json
    - kubectl -n "$APP_NAME" create secret generic acr-pull
        --type=kubernetes.io/dockerconfigjson
        --from-file=.dockerconfigjson=/tmp/dac.json
        --dry-run=client -o yaml | kubectl apply -f -
    - git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CHART_REPO}.git" /tmp/chart
    - helm upgrade --install "$APP_NAME" "/tmp/chart/${CHART_PATH}"
        --namespace "$APP_NAME" -f values.yaml
        --set name="$APP_NAME"
        --set image.repository="$ACR_REGISTRY/$APP_NAME"
        --set image.tag="$IMG_TAG"
        --set host="$APP_HOST"
        --atomic --timeout 180s
    - kubectl rollout status deployment/"$APP_NAME" -n "$APP_NAME" --timeout=180s
  after_script:
    - kubectl config use-context "$KUBE_CONTEXT_PROD" 2>/dev/null || true
    - |
      echo "=== PODS ==="
      kubectl -n "$APP_NAME" get pods 2>/dev/null || true
    - |
      echo "=== LOGS ==="
      kubectl -n "$APP_NAME" logs -l app="$APP_NAME" --tail=50 2>/dev/null || true
    - |
      echo "=== EVENTS ==="
      kubectl -n "$APP_NAME" get events --sort-by='.lastTimestamp' 2>/dev/null | tail -20 || true
    - |
      if [ -n "$TEAMS_WEBHOOK" ]; then
        ICON=$([ "$CI_JOB_STATUS" = "success" ] && echo "OK" || echo "FALHOU")
        curl -s -H "Content-Type: application/json" \
          -d "{\"text\":\"[$ICON] deploy $APP_NAME (prod) -> ${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA} | $CI_PIPELINE_URL\"}" \
          "$TEAMS_WEBHOOK" || true
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
